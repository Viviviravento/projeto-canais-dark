version: 0.2.0
status: provisional
selection_order:
  - communicative_meaning
  - minimum_fidelity
  - authenticity
  - quality
  - license
  - required_outcome
  - expected_total_cost
  - expected_value
  - cost_benefit
rules:
  direct_price_is_not_the_objective: true
  price_only_compares_eligible_options: true
  total_cost_includes:
    - paid_execution
    - probable_rework
    - human_operation
    - downstream_processing
  value_can_include:
    - communicative_gain
    - reliability
    - reusability
    - expected_return
    - useful_learning
  higher_spend_requires_material_gain_or_risk_reduction: true
  never_sacrifice_required_outcome_to_reduce_spend: true
